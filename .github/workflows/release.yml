name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore TSRpg/TSRpg.csproj

      - name: Build (Release)
        run: dotnet build TSRpg/TSRpg.csproj -c Release --no-restore

      - name: Collect artifact
        run: |
          mkdir -p dist
          cp TSRpg/bin/Release/net9.0/TSRpg.dll dist/TSRpg.dll

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TSRpg.dll
          generate_release_notes: true
